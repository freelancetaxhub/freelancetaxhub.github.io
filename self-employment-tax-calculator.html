<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Employment Tax Calculator 2026</title>
<meta name="description" content="Calculate 15.3% self-employment tax for freelancers and independent contractors.">
<style>
body{font-family:Arial;margin:0;background:#fff;}
.container{max-width:900px;margin:auto;padding:20px;}
.box{background:#f4f6f8;padding:20px;border-radius:8px;}
input,button{width:100%;padding:10px;margin:8px 0;}
button{background:#0A3D62;color:#fff;border:none;}
.result{background:#eaf2f8;padding:15px;margin-top:10px;}
a{color:#0A3D62;text-decoration:none;}
</style>
</head>
<body>
<div class="container">
<h1>Self-Employment Tax Calculator (15.3%)</h1>

<div class="box">
<label>Net Self-Employment Income ($)</label>
<input type="number" id="income">
<button onclick="calc()">Calculate</button>
<div class="result" id="result"></div>
</div>

<p><a href="index.html">← Back to Home</a></p>
</div>

<script>
function calc(){
var income=parseFloat(document.getElementById("income").value)||0;
var tax=income*0.153;
document.getElementById("result").innerHTML=
"<strong>Self-Employment Tax: $"+tax.toFixed(2)+"</strong>";
}
</script>
</body>
</html>
